[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hqr-waci"
version = "0.1.0"
description = "Quantile regression and width-adaptive conformal prediction."
requires-python = ">=3.13,<3.14"
dependencies = [
    "arch==8.0.0",
    "matplotlib==3.10.6",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
    "scipy==1.16.3",
    "seaborn==0.13.2",
    "statsmodels==0.14.5",
    "tqdm==4.67.1",
]

[tool.setuptools.packages.find]
where = ["src"]
